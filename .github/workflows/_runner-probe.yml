# TEMPORARY — deleted before this branch is opened as a PR.
#
# Turns three assumptions behind #17 into facts before any real workflow is
# built on them:
#   1. is [self-hosted, android-build] reachable from KMM-Argus at all?
#      (the org runners API needs admin:org, so this cannot be read, only tried)
#   2. does actions/setup-node work on that box?
#   3. does headless Chromium actually launch there? `playwright install` pulls
#      the browser but not the system shared libs, and `--with-deps` wants sudo.
#
# Push-triggered rather than workflow_dispatch: dispatch only registers for
# workflows that exist on the default branch.
name: _runner probe (temp)

permissions:
  contents: read

on:
  push:
    paths:
      - '.github/workflows/_runner-probe.yml'

jobs:
  probe:
    runs-on: [self-hosted, android-build]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Box facts
        run: |
          echo "uname:   $(uname -a)"
          echo "whoami:  $(whoami)"
          echo "pwd:     $(pwd)"
          echo "nproc:   $(nproc)"
          echo "git:     $(git --version 2>&1 || echo MISSING)"
          echo "java:    $(java -version 2>&1 | head -1 || echo MISSING)"
          df -h .
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if sudo -n true 2>/dev/null; then echo "sudo: passwordless"; else echo "sudo: NOT available"; fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node facts
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install probe deps
        working-directory: scripts/probe-webui
        run: npm ci

      - name: Install Chromium (no --with-deps)
        working-directory: scripts/probe-webui
        run: npx playwright install chromium

      - name: Can Chromium launch?
        working-directory: scripts/probe-webui
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            console.log('CHROMIUM OK ->', b.version());
            const p = await b.newPage();
            await p.setContent('<h1 id=x>hi</h1>');
            console.log('DOM OK ->', await p.textContent('#x'));
            await b.close();
          })().catch(e => { console.error('CHROMIUM FAILED:', e.message); process.exit(1); });
          "
